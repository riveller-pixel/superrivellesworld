<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Super Rivelles Peris World – Engine Core</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#000;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#5c94fc;}

  /* ── Mobile Touch HUD ─────────────────────────────────── */
  #touch-layer{position:absolute;inset:0;pointer-events:none;z-index:10;display:none;}
  .touch-zone{position:absolute;bottom:24px;pointer-events:auto;display:flex;gap:8px;align-items:flex-end;}
  .dpad-zone{left:20px;}
  .btn-zone{right:20px;}

  /* D-Pad arrows */
  .dpad-grid{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:4px;}
  .dpad-cell{display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:22px;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
  .dpad-cell:active,.dpad-cell.held{background:rgba(255,215,0,.35);border-color:#ffd700;}
  .dpad-cell.blank{background:none;border:none;pointer-events:none;}

  /* A / B action buttons */
  .act-btn{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace,sans-serif;font-size:16px;font-weight:bold;border:3px solid;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .06s;}
  .act-btn:active,.act-btn.held{transform:scale(.88);}
  .btn-a{background:rgba(56,142,60,.7);border-color:#81c784;color:#fff;margin-bottom:30px;}
  .btn-b{background:rgba(198,40,40,.7);border-color:#ef9a9a;color:#fff;}
  .act-label{font-size:7px;margin-top:2px;letter-spacing:1px;opacity:.8;}

  /* Debug info */
  #debug{position:absolute;top:8px;left:8px;color:#fff;font:10px/1.4 monospace;pointer-events:none;z-index:20;text-shadow:1px 1px 0 #000;opacity:.7;}

  @media(max-width:600px){
    .dpad-grid{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:3px;}
    .act-btn{width:56px;height:56px;font-size:14px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- Mobile Touch Layer -->
  <div id="touch-layer">
    <!-- D-Pad (left side) -->
    <div class="touch-zone dpad-zone">
      <div class="dpad-grid">
        <div class="dpad-cell blank"></div>
        <div class="dpad-cell" id="tp-up">▲</div>
        <div class="dpad-cell blank"></div>
        <div class="dpad-cell" id="tp-left">◀</div>
        <div class="dpad-cell blank"></div>
        <div class="dpad-cell" id="tp-right">▶</div>
      </div>
    </div>
    <!-- A / B buttons (right side) -->
    <div class="touch-zone btn-zone">
      <div class="act-btn btn-b" id="tp-b">B<span class="act-label">RUN</span></div>
      <div class="act-btn btn-a" id="tp-a">A<span class="act-label">JUMP</span></div>
    </div>
  </div>

  <div id="debug"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SUPER RIVELLES PERIS WORLD — ENGINE CORE v1
   Professional-grade 16-bit platformer foundation
   ═══════════════════════════════════════════════════════════ */

// ── Virtual Resolution ──────────────────────────────────────
const VIRT_W = 512;
const VIRT_H = 288;

// ── Physics Constants ───────────────────────────────────────
const GRAVITY        = 0.55;
const MAX_FALL       = 9;
const RUN_SPEED      = 3.2;
const SPRINT_SPEED   = 4.6;
const ACCEL          = 0.35;
const DECEL          = 0.28;
const JUMP_VEL       = -9.2;
const JUMP_CUT_MULT  = 0.45;   // variable jump height
const COYOTE_MS      = 150;
const BUFFER_MS      = 150;

// ── Canvas Setup ────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = VIRT_W;
canvas.height = VIRT_H;
ctx.imageSmoothingEnabled = false;

function resizeCanvas() {
  const wrap = document.getElementById('wrap');
  const ww = wrap.clientWidth;
  const wh = wrap.clientHeight;
  const scale = Math.min(ww / VIRT_W, wh / VIRT_H);
  canvas.style.width  = (VIRT_W * scale) + 'px';
  canvas.style.height = (VIRT_H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── Input State ─────────────────────────────────────────────
const input = {
  left: false, right: false, up: false, down: false,
  jump: false,   // true while held
  jumpEdge: false, // true only on the frame it was first pressed
  run: false
};

// Track previous frame for edge detection
let prevJump = false;

// ── Keyboard Handling ───────────────────────────────────────
const keyMap = {
  ArrowLeft:'left', KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up',
  ArrowDown:'down', KeyS:'down',
  Space:'jump', KeyZ:'jump',
  ShiftLeft:'run', ShiftRight:'run', KeyX:'run'
};

window.addEventListener('keydown', e => {
  const k = keyMap[e.code];
  if (k) { input[k] = true; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  const k = keyMap[e.code];
  if (k) { input[k] = false; }
});

// ── Touch Controls ──────────────────────────────────────────
(function setupTouch() {
  // Show touch layer on first touch
  let revealed = false;
  window.addEventListener('touchstart', () => {
    if (!revealed) {
      document.getElementById('touch-layer').style.display = 'block';
      revealed = true;
    }
  }, { once: false, passive: true });

  const bind = (id, key) => {
    const el = document.getElementById(id);
    if (!el) return;
    const on  = e => { e.preventDefault(); input[key] = true;  el.classList.add('held'); };
    const off = e => { e.preventDefault(); input[key] = false; el.classList.remove('held'); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend',   off, { passive: false });
    el.addEventListener('touchcancel',off, { passive: false });
    // mouse fallback for desktop testing
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup',   off);
    el.addEventListener('mouseleave',off);
  };
  bind('tp-left',  'left');
  bind('tp-right', 'right');
  bind('tp-up',    'up');
  bind('tp-a',     'jump');
  bind('tp-b',     'run');
})();

// ── Level Geometry (simple rectangles) ──────────────────────
// { x, y, w, h, color }
const platforms = [
  // Floor
  { x: 0,   y: 256, w: 512, h: 32, color: '#3E2723' },
  // Three staggered test platforms
  { x: 80,  y: 200, w: 80,  h: 12, color: '#6D4C41' },
  { x: 220, y: 168, w: 96,  h: 12, color: '#6D4C41' },
  { x: 370, y: 132, w: 80,  h: 12, color: '#6D4C41' },
];

// ── Player Object ───────────────────────────────────────────
const player = {
  x: 60, y: 200,
  w: 16, h: 24,
  vx: 0, vy: 0,
  onGround: false,
  facingRight: true,

  // Coyote Time: time (ms) since the player last stood on ground
  lastGroundedAt: -Infinity,

  // Jump Buffer: time (ms) when the player last pressed jump
  lastJumpPressAt: -Infinity,

  // Whether the current jump is "alive" (player is still holding the button)
  jumpHeld: false,

  // Animation frame counter
  frame: 0
};

// ── Collision Helpers ───────────────────────────────────────
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolvePlayerVsPlatforms() {
  const p = player;
  p.onGround = false;

  for (const plat of platforms) {
    if (!rectOverlap(p.x, p.y, p.w, p.h, plat.x, plat.y, plat.w, plat.h)) continue;

    // Calculate overlap depths from each side
    const overlapLeft   = (p.x + p.w) - plat.x;
    const overlapRight  = (plat.x + plat.w) - p.x;
    const overlapTop    = (p.y + p.h) - plat.y;
    const overlapBottom = (plat.y + plat.h) - p.y;

    // Find the smallest overlap to determine push-out direction
    const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

    if (minOverlap === overlapTop && p.vy >= 0) {
      // Landing on top
      p.y = plat.y - p.h;
      p.vy = 0;
      p.onGround = true;
    } else if (minOverlap === overlapBottom && p.vy < 0) {
      // Hitting head on bottom
      p.y = plat.y + plat.h;
      p.vy = 0;
    } else if (minOverlap === overlapLeft) {
      // Hitting left side of platform
      p.x = plat.x - p.w;
      p.vx = 0;
    } else if (minOverlap === overlapRight) {
      // Hitting right side of platform
      p.x = plat.x + plat.w;
      p.vx = 0;
    }
  }
}

// ── Main Update ─────────────────────────────────────────────
function update(now) {
  const p = player;

  // ── Edge detection for jump press ──
  input.jumpEdge = (input.jump && !prevJump);
  prevJump = input.jump;

  // ── Record jump buffer ──
  if (input.jumpEdge) {
    p.lastJumpPressAt = now;
  }

  // ── Horizontal movement ──
  const topSpeed = input.run ? SPRINT_SPEED : RUN_SPEED;

  if (input.left) {
    p.vx = Math.max(p.vx - ACCEL, -topSpeed);
    p.facingRight = false;
  } else if (input.right) {
    p.vx = Math.min(p.vx + ACCEL, topSpeed);
    p.facingRight = true;
  } else {
    // Decelerate toward zero
    if (p.vx > 0) p.vx = Math.max(0, p.vx - DECEL);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + DECEL);
  }

  // ── Gravity ──
  p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);

  // ── Track grounded time for coyote time ──
  if (p.onGround) {
    p.lastGroundedAt = now;
  }

  // ── Jump Logic (with Coyote Time + Input Buffering) ──
  const coyoteOk = (now - p.lastGroundedAt) <= COYOTE_MS;
  const bufferOk = (now - p.lastJumpPressAt) <= BUFFER_MS;

  if ((input.jumpEdge && coyoteOk) || (bufferOk && p.onGround)) {
    p.vy = JUMP_VEL;
    p.onGround = false;
    p.jumpHeld = true;
    p.lastGroundedAt = -Infinity;  // consume coyote
    p.lastJumpPressAt = -Infinity; // consume buffer
  }

  // ── Variable Jump Height (release early = lower jump) ──
  if (p.jumpHeld && !input.jump) {
    if (p.vy < 0) {
      p.vy *= JUMP_CUT_MULT;
    }
    p.jumpHeld = false;
  }

  // ── Apply velocity ──
  p.x += p.vx;
  p.y += p.vy;

  // ── Collision resolution ──
  resolvePlayerVsPlatforms();

  // ── World bounds ──
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x + p.w > VIRT_W) { p.x = VIRT_W - p.w; p.vx = 0; }

  // ── Fall rescue (kid-friendly) ──
  if (p.y > VIRT_H + 40) {
    p.y = 60;
    p.vy = 0;
  }

  // ── Animation frame ──
  p.frame++;
}

// ── Rendering ───────────────────────────────────────────────
function render(now) {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, VIRT_H);
  grad.addColorStop(0, '#5C94FC');
  grad.addColorStop(1, '#89b8ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VIRT_W, VIRT_H);

  // Simple rolling clouds (parallax)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 160) + (now * 0.012)) % (VIRT_W + 80) - 40;
    const cy = 30 + i * 18;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, Math.PI * 2);
    ctx.arc(cx + 18, cy - 4, 18, 0, Math.PI * 2);
    ctx.arc(cx + 36, cy, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  // Platforms
  for (const plat of platforms) {
    // Main body
    ctx.fillStyle = plat.color;
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    // Grass / surface highlight (top 3px)
    ctx.fillStyle = plat === platforms[0] ? '#66BB6A' : '#A1887F';
    ctx.fillRect(plat.x, plat.y, plat.w, 3);
    // Dark edge (bottom 1px)
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(plat.x, plat.y + plat.h - 1, plat.w, 1);
  }

  // Player
  const p = player;
  const isMoving = Math.abs(p.vx) > 0.3;
  const isAirborne = !p.onGround;
  const legCycle = isMoving ? Math.sin(p.frame * 0.4) * 3 : 0;

  ctx.save();
  ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
  if (!p.facingRight) ctx.scale(-1, 1);

  // Body (blue rectangle with slight detail)
  ctx.fillStyle = '#1565C0';
  ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

  // Head area (skin tone)
  ctx.fillStyle = '#FFCC80';
  ctx.fillRect(-p.w / 2 + 2, -p.h / 2, p.w - 4, 8);

  // Cap
  ctx.fillStyle = '#1976D2';
  ctx.fillRect(-p.w / 2, -p.h / 2, p.w, 4);
  ctx.fillRect(-p.w / 2 + p.w / 2, -p.h / 2, p.w / 2 + 2, 3); // brim

  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(p.w / 2 - 5, -p.h / 2 + 4, 2, 2);

  // Legs (animated)
  ctx.fillStyle = '#0D47A1';
  if (isAirborne) {
    // Legs spread in air
    ctx.fillRect(-p.w / 2, p.h / 2 - 4, 5, 4);
    ctx.fillRect(p.w / 2 - 5, p.h / 2 - 4, 5, 4);
  } else {
    ctx.fillRect(-p.w / 2 + legCycle, p.h / 2 - 4, 5, 4);
    ctx.fillRect(p.w / 2 - 5 - legCycle, p.h / 2 - 4, 5, 4);
  }

  ctx.restore();

  // Coyote/Buffer debug indicators
  const coyoteActive = (now - p.lastGroundedAt) <= COYOTE_MS && !p.onGround;
  const bufferActive = (now - p.lastJumpPressAt) <= BUFFER_MS;

  if (coyoteActive) {
    ctx.fillStyle = 'rgba(0,230,118,0.4)';
    ctx.fillRect(p.x - 1, p.y + p.h, p.w + 2, 3);
  }
  if (bufferActive) {
    ctx.fillStyle = 'rgba(255,215,0,0.5)';
    ctx.fillRect(p.x - 1, p.y - 4, p.w + 2, 3);
  }

  // Debug HUD
  const dbg = document.getElementById('debug');
  dbg.textContent =
    `pos: ${p.x.toFixed(0)}, ${p.y.toFixed(0)}  vel: ${p.vx.toFixed(1)}, ${p.vy.toFixed(1)}\n` +
    `ground: ${p.onGround}  coyote: ${coyoteActive}  buffer: ${bufferActive}`;
}

// ── Game Loop (fixed-step aware, render at display rate) ────
let lastTime = performance.now();

function gameLoop(timestamp) {
  update(timestamp);
  render(timestamp);
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
